services:
  - type: web
    name: vishwaneed-api
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run prisma:generate --workspace @vishwaneed/api && npm run build --workspace @vishwaneed/api
    startCommand: npm run prisma:migrate --workspace @vishwaneed/api && npm run prisma:seed --workspace @vishwaneed/api && node apps/api/dist/main.js
    healthCheckPath: /api/v1/categories
    disk:
      name: vishwaneed-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vishwaneed-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BANK_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CUSTOMER_WEB_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PRIVATE_UPLOAD_DIR
        value: /var/data/private-uploads
      - key: PUBLIC_UPLOAD_DIR
        value: /var/data/public-uploads
      - key: INTERAKT_API_URL
        value: https://api.interakt.ai/v1/public/message/
      - key: SETTLEMENT_DAYS
        value: "7"
      - key: RETURN_WINDOW_DAYS
        value: "7"
      - key: CHECKOUT_QUOTE_TTL_MINUTES
        value: "10"

databases:
  - name: vishwaneed-postgres
    plan: 0.1c-256mb
    region: singapore
    databaseName: vishwaneed
    user: vishwaneed
    ipAllowList: []
